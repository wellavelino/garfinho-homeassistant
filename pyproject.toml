[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garfinho"
version = "0.1.0"
description = "Unofficial async client for the Garfinho recipe app (BuildFire backend)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13,<3.14"
dependencies = ["aiohttp>=3.9"]

[project.scripts]
garfinho = "garfinho_client.cli:main"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component",
    "ruff>=0.6",
    "mypy>=1.11",
    "home-assistant-frontend>=20260128.6",
]

[tool.hatch.build.targets.wheel]
packages = ["custom_components/garfinho/garfinho_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "custom_components/garfinho"]

[tool.ruff]
line-length = 100
src = ["custom_components/garfinho", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["ASYNC109"]  # login polling implements its own deadline

[tool.mypy]
strict = true
files = ["custom_components/garfinho/garfinho_client"]
